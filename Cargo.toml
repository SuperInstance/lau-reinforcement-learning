[package]
name = "lau-reinforcement-learning"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-reinforcement-learning"
description = "Reinforcement learning library — MDP formalism, dynamic programming, TD learning, Q-learning, policy gradients, multi-armed bandits, and grid world environments"

[dependencies]
serde = { version = "1", features = ["derive"] }
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
rand_chacha = "0.3"
